name: Daily Python Commit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
  push:
    branches: [main]

# ✅ Опция для поддержки новых версий Actions
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4  # Работает с Node 24 благодаря env выше

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 🔄 Запуск ежедневной задачи
        run: python3 scripts/daily_job.py

      - name: 📤 Коммит и пуш
        run: |
          git config user.name "MaxMad446"
          git config user.email "Puper-1981@mail.ru"
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "🤖 Daily: $(date +%F)"
            git push
            echo "✅ Pushed"
          else
            echo "⚠️ No changes"
          fi